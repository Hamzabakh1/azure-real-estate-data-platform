[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-real-estate-data-platform"
version = "1.0.0"
description = "Reference implementation of an Azure medallion data platform for real-estate analytics"
requires-python = ">=3.10"
authors = [{ name = "Hamza Bakh" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
real-estate-pipeline = "real_estate_platform.cli:main"

[tool.setuptools.packages.find]
include = ["real_estate_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
