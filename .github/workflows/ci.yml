name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint dependency
        run: python -m pip install --upgrade pip ruff
      - name: Lint
        run: ruff check real_estate_platform tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run end-to-end pipeline
        run: python -m real_estate_platform.cli run --as-of 2026-09-10
