<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Azure Real Estate Data Platform</title>
  <desc id="desc">An end-to-end real estate analytics platform on Azure, from sources through Azure Data Factory and medallion storage into Azure SQL, Power BI, monitoring and Key Vault.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#061a33"/><stop offset="1" stop-color="#0b4a7a"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#6bd6ff"/></marker>
    <marker id="secure" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#71e5b4"/></marker>
    <style>
      .title{font:700 31px Segoe UI,Arial,sans-serif;fill:#fff}.subtitle{font:400 15px Segoe UI,Arial,sans-serif;fill:#c4ddf1}.label{font:700 14px Segoe UI,Arial,sans-serif;fill:#8ad8ff;letter-spacing:1.5px}.box{fill:#0b2c50;stroke:#4c91c5;stroke-width:1.3}.bronze{fill:#59331f;stroke:#d4945d}.silver{fill:#334b60;stroke:#b8cedd}.gold{fill:#594817;stroke:#f2cb59}.side{fill:#092745;stroke:#3d7dac}.name{font:700 17px Segoe UI,Arial,sans-serif;fill:#fff}.detail{font:400 13px Segoe UI,Arial,sans-serif;fill:#c7deef}.small{font:400 12px Segoe UI,Arial,sans-serif;fill:#bad4e9}.flow{fill:none;stroke:#6bd6ff;stroke-width:3;marker-end:url(#arrow)}.guard{fill:none;stroke:#71e5b4;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#secure)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="65" y="58" class="title">Azure Real Estate Data Platform</text>
  <text x="65" y="86" class="subtitle">Data contracts · Bronze / Silver / Gold · Quality gates · Power BI-ready marts</text>

  <text x="65" y="140" class="label">MULTI-SOURCE LANDING</text>
  <g filter="url(#shadow)"><rect x="65" y="165" width="210" height="105" rx="14" class="box"/><text x="90" y="207" class="name">Listing feeds</text><text x="90" y="234" class="detail">CSV / partner exports</text><text x="90" y="254" class="small">daily snapshots</text>
  <rect x="65" y="305" width="210" height="105" rx="14" class="box"/><text x="90" y="347" class="name">Agency master</text><text x="90" y="374" class="detail">REST API / JSON</text><text x="90" y="394" class="small">reference entities</text>
  <rect x="65" y="445" width="210" height="105" rx="14" class="box"/><text x="90" y="487" class="name">Transactions</text><text x="90" y="514" class="detail">operational CSV feed</text><text x="90" y="534" class="small">incremental events</text></g>

  <text x="355" y="140" class="label">ORCHESTRATION</text>
  <g filter="url(#shadow)"><rect x="345" y="260" width="250" height="180" rx="16" class="box"/><image href="icons/azure-data-factory.svg" x="370" y="292" width="72" height="72"/><text x="458" y="319" class="name">Azure Data Factory</text><text x="458" y="346" class="detail">Copy · dependencies · retry</text><text x="458" y="369" class="detail">quality gate · run logging</text><text x="370" y="407" class="small">system-assigned managed identity</text></g>

  <text x="675" y="140" class="label">MEDALLION DATA LAKE</text>
  <g filter="url(#shadow)"><rect x="650" y="165" width="235" height="125" rx="14" class="bronze"/><image href="icons/azure-storage.svg" x="674" y="190" width="58" height="58"/><text x="748" y="210" class="name">Azure Storage</text><text x="748" y="237" class="detail">BRONZE · immutable raw</text><text x="748" y="258" class="small">ingest_date / run_id</text>
  <rect x="650" y="340" width="235" height="125" rx="14" class="silver"/><image href="icons/azure-storage.svg" x="674" y="365" width="58" height="58"/><text x="748" y="385" class="name">Azure Storage</text><text x="748" y="412" class="detail">SILVER · conformed</text><text x="748" y="433" class="small">dedupe · contract checks</text>
  <rect x="650" y="515" width="235" height="125" rx="14" class="box"/><image href="icons/azure-storage.svg" x="674" y="540" width="58" height="58"/><text x="748" y="560" class="name">Quarantine</text><text x="748" y="587" class="detail">invalid records + reason</text><text x="748" y="608" class="small">auditable remediation</text></g>

  <text x="970" y="140" class="label">GOVERNED ANALYTICS</text>
  <g filter="url(#shadow)"><rect x="950" y="260" width="265" height="180" rx="16" class="gold"/><image href="icons/azure-sql-database.svg" x="975" y="292" width="72" height="72"/><text x="1063" y="319" class="name">Azure SQL Database</text><text x="1063" y="346" class="detail">GOLD facts + dimensions</text><text x="1063" y="369" class="detail">semantic mart views</text><text x="975" y="407" class="small">idempotent MERGE loads</text>
  <rect x="1290" y="260" width="235" height="180" rx="16" class="box"/><image href="icons/power-bi.svg" x="1315" y="292" width="72" height="72"/><text x="1402" y="319" class="name">Power BI</text><text x="1402" y="346" class="detail">city KPIs</text><text x="1402" y="369" class="detail">price / sqm drill-through</text><text x="1315" y="407" class="small">read-only marts</text></g>

  <text x="970" y="535" class="label">SECURITY &amp; OPERATIONS</text>
  <g filter="url(#shadow)"><rect x="950" y="560" width="265" height="130" rx="14" class="side"/><image href="icons/azure-key-vault.svg" x="975" y="588" width="60" height="60"/><text x="1051" y="613" class="name">Azure Key Vault</text><text x="1051" y="639" class="detail">external-source secrets</text><text x="1051" y="660" class="small">RBAC + managed identity</text>
  <rect x="1290" y="560" width="235" height="130" rx="14" class="side"/><image href="icons/azure-monitor.svg" x="1315" y="588" width="60" height="60"/><image href="icons/log-analytics.svg" x="1378" y="588" width="60" height="60"/><text x="1500" y="613" class="name" text-anchor="end">Azure Monitor</text><text x="1500" y="639" class="detail" text-anchor="end">Log Analytics · alerts</text><text x="1500" y="660" class="small" text-anchor="end">pipeline observability</text></g>

  <path d="M275 217H345" class="flow"/><path d="M275 357H320V350H345" class="flow"/><path d="M275 497H320V350H345" class="flow"/><path d="M595 350H620V227H650" class="flow"/><path d="M767 290V340" class="flow"/><path d="M885 402H920V350H950" class="flow"/><path d="M1215 350H1290" class="flow"/><path d="M595 390H620V577H650" class="flow"/>
  <path d="M1082 560V480H470V440" class="guard"/><path d="M1407 560V505H470V440" class="guard"/>
  <text x="650" y="760" class="subtitle">Bicep defines the Azure baseline. The standard-library local runner mirrors the same contracts for reproducible portfolio demonstrations.</text>
  <text x="650" y="790" class="small">Azure product icons © Microsoft; used under the Azure Architecture Icon terms.</text>
</svg>
